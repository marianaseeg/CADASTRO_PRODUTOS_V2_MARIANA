<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TELA DE LOGIN -->
    <div class="container" id="tela-login">
       <img src="./IMAGENS/eu.jpg" alt="Minha foto" style="width: 200px;">
       <img src="IMAGENS/eu.jpg" width="200">

        <h1>Login</h1>

        <form id="login-form">

            <div class="campo">
                <label>Email:</label>
                <input type="email" id="login-email" required>
            </div>

            <div class="campo">
                <label>Senha:</label>
                <input type="password" id="login-senha" required>
            </div>

            <button type="submit">Entrar</button>

        </form>

        <p>
            Ainda não possui cadastro?
            <button type="button" id="mostrar-cadastro">Cadastrar</button>
        </p>

    </div>


    <!-- TELA DE CADASTRO -->
    <div class="container" id="tela-cadastro" style="display: none;">

        <h1>Criar conta</h1>

        <form id="cadastro-form">

            <div class="campo">
                <label>Nome:</label>
                <input type="text" id="cadastro-nome" required>
            </div>

            <div class="campo">
                <label>Email:</label>
                <input type="email" id="cadastro-email" required>
            </div>

            <div class="campo">
                <label>Senha:</label>
                <input type="password" id="cadastro-senha" required>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

        <p>
            Já possui uma conta?
            <button type="button" id="mostrar-login">Voltar para login</button>
        </p>

    </div>


    <!-- TELA DE PRODUTOS -->
    <div class="container" id="tela-produtos" style="display: none;">

        <h1>Cadastro de Produtos</h1>

        <p id="usuario-logado"></p>

        <button type="button" id="sair">Sair</button>

        <form id="produto-form">

            <div class="campos-produto">

                <div class="campo">
                    <label>Nome:</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label>Preço:</label>
                    <input type="number" id="preco" min="0.01" step="0.01" required>
                </div>

                <div class="campo">
                    <label>Quantidade:</label>
                    <input type="number" id="quantidade" min="1" step="1" required>
                </div>

            </div>

            <button type="submit">Adicionar Produto!</button>

        </form>

        <button id="limpar-tabela">Limpar tabela</button>

        <h3 id="total-estoque">Total em Estoque: R$ 0.00</h3>

        <table id="tabela-produtos">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Total item</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
